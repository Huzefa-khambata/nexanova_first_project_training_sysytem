<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Subject | NexaNova</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nav-container">
    <h1 class="animate">Add Subject</h1>
    
    <form id="subjectForm" class="animate" style="animation-delay: 0.2s">
      <div style="max-width: 600px; margin: 0 auto;">
        <label for="subject_id">Subject ID:</label>
        <input type="number" id="subject_id" name="subject_id" required>
        
        <label for="subject_name">Subject Name:</label>
        <input type="text" id="subject_name" name="subject_name" required>
        
        <button type="submit" class="nav-link" style="text-align: center; margin-top: 1.5rem;">Add Subject</button>
      </div>
    </form>

    <p id="message" style="text-align: center; margin: 2rem 0;"></p>
    
    <a href="/" class="nav-link animate" style="animation-delay: 0.3s; max-width: 200px; margin: 0 auto;">Back to Home</a>
  </div>

  <footer class="footer animate" style="animation-delay: 0.4s">
    Designed and Developed by Huzefa Khambata
  </footer>

  <script>
    messageEl.classList.add('show');
setTimeout(() => messageEl.classList.remove('show'), 3000);

    document.getElementById('subjectForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const subject = {
        subject_id: document.getElementById('subject_id').value,
        subject_name: document.getElementById('subject_name').value
      };

      const response = await fetch('/subject', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(subject)
      });

      const result = await response.json();
      const messageEl = document.getElementById('message');
      
      if (response.status === 201) {
        messageEl.innerText = "Subject added successfully!";
        messageEl.style.color = "green";
        document.getElementById('subjectForm').reset();
      } else {
        messageEl.innerText = result.error || "Something went wrong.";
        messageEl.style.color = "red";
      }
    });
  </script>
</body>
</html>
