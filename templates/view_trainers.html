<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Trainers | NexaNova</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nav-container">
    <h1 class="animate">View Trainers</h1>
    
    <div class="animate" style="animation-delay: 0.2s; width: 100%; max-width: 1000px; margin: 2rem auto; overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr>
            <th style="padding: 1rem; text-align: left; background-color: var(--black); color: white;">Emp ID</th>
            <th style="padding: 1rem; text-align: left; background-color: var(--black); color: white;">Name</th>
            <th style="padding: 1rem; text-align: left; background-color: var(--black); color: white;">Email</th>
            <th style="padding: 1rem; text-align: left; background-color: var(--black); color: white;">Phone</th>
            <th style="padding: 1rem; text-align: left; background-color: var(--black); color: white;">Subject ID</th>
          </tr>
        </thead>
        <tbody id="trainersTableBody">
          <!-- Data will be inserted here by JavaScript -->
        </tbody>
      </table>
    </div>
    
    <a href="/" class="nav-link animate" style="animation-delay: 0.3s; max-width: 200px; margin: 0 auto;">Back to Home</a>
  </div>

  <footer class="footer animate" style="animation-delay: 0.4s">
    Designed and Developed by Huzefa Khambata
  </footer>

  <script>
    async function fetchTrainers() {
      const response = await fetch('/trainer');
      const trainers = await response.json();
      const tableBody = document.getElementById('trainersTableBody');
      tableBody.innerHTML = '';

      trainers.forEach(trainer => {
        const row = document.createElement('tr');
        row.style.borderBottom = '1px solid #eee';
        row.innerHTML = `
          <td style="padding: 1rem;">${trainer.empid}</td>
          <td style="padding: 1rem;">${trainer.name}</td>
          <td style="padding: 1rem;">${trainer.email}</td>
          <td style="padding: 1rem;">${trainer.phone}</td>
          <td style="padding: 1rem;">${trainer.subject_id}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    fetchTrainers();
  </script>
</body>
</html>
